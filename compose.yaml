x-api-healthcheck: &api-healthcheck
  test:
    [
      "CMD-SHELL",
      "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)\"",
    ]
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 30s

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    restart: unless-stopped

  api1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *api-healthcheck
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m

  api2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *api-healthcheck
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m

  api3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *api-healthcheck
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m

  # REDIS_PASSWORD is mandatory: compose fails fast if it is unset or empty.
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 160mb
      - --maxmemory-policy
      - allkeys-lfu
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the root .env}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the root .env}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m

  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: link_shortener
      CASSANDRA_NUM_TOKENS: 16
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  redis_data:
  cassandra_data: