[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "enzo-garcia", email = "enzocomp.garcia@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cassandra-driver>=3.30.1",
    "fastapi[standard]>=0.143.0",
    "hashids>=1.3.1",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "tldextract>=5.4.0",
]

[project.scripts]
backend = "backend:main"

[tool.ruff.lint]
ignore = ["B008", "TRY201"]

[tool.uv.build-backend]
module-name = "app"
namespace = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstrument>=5.1.3",
    "pytest>=9.1.1",
]
